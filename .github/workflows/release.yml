name: Release on version bump
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: horizon-release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect version change
        id: version
        shell: bash
        run: node scripts/release-version.mjs
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install native Linux playback build dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install-mpv-build-deps.sh
      - name: Build installers and update manifests
        run: npx electron-builder --config electron-builder.cjs --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 7
  server:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run package:server
      - run: npm run test:server-release
      - uses: actions/upload-artifact@v7
        with:
          name: release-server
          path: |
            release-assets/horizon-server-*-linux-x64.tar.gz
            release-assets/horizon-server.mjs
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [version, build, server]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish complete release
        run: node scripts/publish-release.mjs
