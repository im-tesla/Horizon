name: Checks and desktop builds
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Restore verified Linux playback bundle
        if: runner.os == 'Linux'
        id: mpv-cache
        uses: actions/cache/restore@v5
        with:
          path: resources/mpv/linux-x64
          key: mpv-linux-glibc235-${{ hashFiles('scripts/mpv-manifest.json', 'scripts/bundle-mpv.mjs', 'scripts/build-linux-mpv-deps.mjs', 'scripts/install-mpv-build-deps.sh', 'scripts/verify-linux-runtime.mjs', 'resources/THIRD_PARTY_NOTICES.md') }}
      - name: Install native Linux playback build dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install-mpv-build-deps.sh
      - name: Package desktop
        if: runner.os == 'Windows'
        run: npm run package:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Package and install Ubuntu desktop
        if: runner.os == 'Linux'
        run: |
          npx electron-builder --config electron-builder.cjs --linux deb --publish never
          bash scripts/test-linux-package.sh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Cache built Linux playback bundle
        if: always() && runner.os == 'Linux' && steps.mpv-cache.outputs.cache-hit != 'true' && hashFiles('resources/mpv/linux-x64/bundle.json') != ''
        uses: actions/cache/save@v5
        with:
          path: resources/mpv/linux-x64
          key: mpv-linux-glibc235-${{ hashFiles('scripts/mpv-manifest.json', 'scripts/bundle-mpv.mjs', 'scripts/build-linux-mpv-deps.mjs', 'scripts/install-mpv-build-deps.sh', 'scripts/verify-linux-runtime.mjs', 'resources/THIRD_PARTY_NOTICES.md') }}
      - uses: actions/upload-artifact@v7
        with:
          name: horizon-${{ runner.os }}-unpacked
          path: |
            release/*-unpacked/
            release/*.deb
          retention-days: 7
  linux-newer:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: horizon-Linux-unpacked
          path: release
      - name: Install and play the same package on Ubuntu 24.04
        run: bash scripts/test-linux-package.sh
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build precompiled native server archive
        run: npm run package:server
      - run: npm run test:server-release
      - uses: actions/upload-artifact@v7
        with:
          name: horizon-server
          path: release-assets/horizon-server-*-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7
